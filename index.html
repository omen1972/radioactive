<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RadioActive</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-black: #000000; 
            --neon-blue: #00f3ff;
            --neon-orange: #ff9d00;
            --card-bg: #111111;
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
        }

        /* Scrollbar invisible para mantener estética */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-black);
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        .app-header { 
            padding: 45px 20px 10px; 
            display: grid;
            grid-template-columns: 85px 1fr 100px;
            align-items: center;
            flex-shrink: 0; 
        }
        
        .header-logo {
            width: 72px; 
            height: 72px;
            object-fit: contain;
            border-radius: 12px;
        }

        .app-title { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 1.2rem; 
            letter-spacing: 2px; 
            text-align: center;
        }
        .app-title span { color: var(--neon-orange); }

        .header-time { text-align: right; font-family: 'Orbitron', sans-serif; line-height: 1.1; }
        #h-time { color: var(--neon-blue); font-size: 0.95rem; }
        #h-date { color: var(--neon-orange); font-size: 0.65rem; font-weight: 700; margin-top: 2px; }

        .neon-divider {
            height: 2px;
            background: var(--neon-blue);
            margin: 0 20px 10px;
            box-shadow: 0 0 10px var(--neon-blue);
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* --- SEARCH --- */
        .search-area { padding: 5px 20px 10px; flex-shrink: 0; }
        .search-box {
            width: 100%; background: #151515; border: 1px solid #333; padding: 15px;
            border-radius: 12px; color: white; font-size: 1.1rem; outline: none;
        }

        /* --- LISTADO (CON SCROLL SUAVE) --- */
        .main-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px 20px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; /* Scroll fluido en iOS/Android */
        }

        .station-card {
            background: var(--card-bg); 
            margin-bottom: 12px; 
            padding: 15px; /* Más grandes para mejor toque */
            border-radius: 15px; 
            display: flex; 
            align-items: center; 
            gap: 15px;
            border: 1px solid #222;
        }

        .station-thumb { width: 55px; height: 55px; border-radius: 12px; object-fit: contain; background: #000; }
        .station-info { flex: 1; min-width: 0; }
        .station-name { font-size: 1.1rem; font-weight: 700; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .station-meta { color: var(--neon-orange); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        
        .fav-star { font-size: 1.8rem; color: #333; padding: 5px; cursor: pointer; }
        .fav-star.active { color: var(--neon-orange); text-shadow: 0 0 8px var(--neon-orange); }

        /* --- PLAYER BAR --- */
        .player-bar {
            background: #050505; border-top: 1px solid var(--neon-blue);
            padding: 15px 15px calc(15px + var(--safe-bottom));
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            flex-shrink: 0;
        }

        .p-info { min-width: 0; }
        .p-now { font-weight: 700; font-size: 1.1rem; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-sub { font-size: 0.9rem; color: var(--neon-orange); font-weight: 700; text-transform: uppercase; }

        .play-container { position: relative; width: 80px; height: 80px; display: flex; justify-content: center; align-items: center; }
        .play-btn {
            width: 60px; height: 60px; background: var(--neon-orange); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; z-index: 5;
        }
        .play-btn svg { width: 30px; fill: #000; }

        .ring {
            position: absolute; width: 60px; height: 60px;
            border: 2px solid var(--neon-orange); border-radius: 50%;
            opacity: 0; z-index: 1; pointer-events: none;
        }
        .is-playing .ring { animation: sonar 2s linear infinite; }
        @keyframes sonar {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.3); opacity: 0; }
        }

        .vol-column { display: flex; justify-content: flex-end; }
        .vol-slider { width: 70px; accent-color: var(--neon-orange); }

        /* --- NAV BAR --- */
        .nav-bar { 
            background: #000; 
            display: flex; 
            padding: 12px 10px calc(12px + var(--safe-bottom));
            gap: 8px;
            border-top: 1px solid #222;
        }
        .nav-item { 
            flex: 1; 
            padding: 14px 2px; 
            text-align: center; 
            color: #666; 
            font-size: 0.65rem; 
            font-weight: 700; 
            background: #111;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid #333;
            font-family: 'Orbitron', sans-serif;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-item.active { 
            color: var(--neon-blue); 
            border-color: var(--neon-blue);
            background: #1a1a1a;
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.1);
        }

    </style>
</head>
<body>

    <header class="app-header">
        <img src="logo.svg" class="header-logo" alt="Logo">
        <div class="app-title">RADIO<span>ACTIVE</span></div>
        <div class="header-time" id="clock">
            <div id="h-time">00:00</div>
            <div id="h-date">--/--/--</div>
        </div>
    </header>

    <div class="neon-divider"></div>

    <div class="search-area" id="search-container">
        <input type="text" class="search-box" id="query" placeholder="Sintonizar emisora..." autocomplete="off">
    </div>

    <main class="main-list" id="list"></main>

    <div class="player-bar" id="player-ui">
        <div class="p-info">
            <div class="p-now" id="p-name">RadioActive</div>
            <div class="p-sub" id="p-meta">SISTEMA LISTO</div>
        </div>

        <div class="play-container" id="play-visuals">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="play-btn" id="btn-play">
                <svg id="ico-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="ico-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </div>
        </div>

        <div class="vol-column">
            <input type="range" class="vol-slider" id="vol" min="0" max="1" step="0.05" value="0.8">
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item" id="nav-fav">FAVORITOS</div>
        <div class="nav-item active" id="nav-exp">EXPLORAR</div>
        <div class="nav-item" id="nav-last">ÚLTIMAS</div>
        <a href="mailto:mediaseventf@gmail.com" class="nav-item">CONTACTO</a>
    </nav>

    <audio id="radio" crossorigin="anonymous"></audio>

    <script>
        const radio = document.getElementById('radio');
        const queryInput = document.getElementById('query');
        const listContainer = document.getElementById('list');
        const pName = document.getElementById('p-name');
        const pMeta = document.getElementById('p-meta');
        const btnPlay = document.getElementById('btn-play');
        const volSlider = document.getElementById('vol');
        
        const defaultLogo = 'logo.svg';

        let favs = JSON.parse(localStorage.getItem('ra_favs_v13')) || [];
        let history = JSON.parse(localStorage.getItem('ra_hist_v13')) || [];
        let viewMode = 'explore';

        function updateClock() {
            const now = new Date();
            document.getElementById('h-time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('h-date').innerText = now.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        window.onload = () => {
            const last = JSON.parse(localStorage.getItem('ra_last_v13'));
            if(last) {
                pName.innerText = last.name;
                pMeta.innerText = last.country;
                radio.src = last.url;
            }
            radio.volume = volSlider.value;
        };

        async function fetchStations(val) {
            if(!val) return;
            listContainer.innerHTML = `<div style="text-align:center; padding:40px; color:var(--neon-blue); font-family:'Orbitron'; font-size:0.8rem;">BUSCANDO SEÑAL...</div>`;
            try {
                const res = await fetch(`https://de1.api.radio-browser.info/json/stations/search?name=${encodeURIComponent(val)}&limit=50&hidebroken=true`);
                const data = await res.json();
                render(data);
            } catch (e) { listContainer.innerHTML = `<div style="color:red; text-align:center;">ERROR DE CONEXIÓN</div>`; }
        }

        function render(data) {
            listContainer.innerHTML = '';
            if(!data || data.length === 0) {
                listContainer.innerHTML = `<div style="text-align:center; padding:20px; color:#444;">Sin resultados</div>`;
                return;
            }
            data.forEach(s => {
                const isFav = favs.some(f => f.stationuuid === s.stationuuid);
                const card = document.createElement('div');
                card.className = 'station-card';
                const thumb = (s.favicon && s.favicon.includes('http')) ? s.favicon : defaultLogo;

                card.innerHTML = `
                    <img class="station-thumb" src="${thumb}" onerror="this.src='${defaultLogo}'">
                    <div class="station-info">
                        <div class="station-name">${s.name}</div>
                        <div class="station-meta">${s.country || 'DESCONOCIDO'}</div>
                    </div>
                    <div class="fav-star ${isFav ? 'active' : ''}">★</div>
                `;
                card.onclick = () => playStation(s);
                const star = card.querySelector('.fav-star');
                star.onclick = (e) => { e.stopPropagation(); toggleFav(s); star.classList.toggle('active'); };
                listContainer.appendChild(card);
            });
        }

        function playStation(s) {
            radio.src = s.url;
            radio.play().catch(() => {});
            pName.innerText = s.name;
            pMeta.innerText = s.country || 'INTERNACIONAL';
            document.getElementById('play-visuals').classList.add('is-playing');
            updateIcons(true);
            
            localStorage.setItem('ra_last_v13', JSON.stringify({url: s.url, name: s.name, country: s.country}));
            
            history = history.filter(item => item.stationuuid !== s.stationuuid);
            history.unshift(s);
            if(history.length > 30) history.pop();
            localStorage.setItem('ra_hist_v13', JSON.stringify(history));
        }

        function updateIcons(playing) {
            document.getElementById('ico-play').style.display = playing ? 'none' : 'block';
            document.getElementById('ico-pause').style.display = playing ? 'block' : 'none';
        }

        btnPlay.onclick = () => {
            if(!radio.src) return;
            if(radio.paused) { 
                radio.play(); 
                updateIcons(true); 
                document.getElementById('play-visuals').classList.add('is-playing'); 
            } else { 
                radio.pause(); 
                updateIcons(false); 
                document.getElementById('play-visuals').classList.remove('is-playing'); 
            }
        };

        volSlider.oninput = (e) => { radio.volume = e.target.value; };

        function toggleFav(station) {
            const idx = favs.findIndex(f => f.stationuuid === station.stationuuid);
            if(idx > -1) favs.splice(idx, 1);
            else favs.push(station);
            localStorage.setItem('ra_favs_v13', JSON.stringify(favs));
            if(viewMode === 'favs') render(favs);
        }

        const navs = document.querySelectorAll('.nav-item');
        function resetNav() { navs.forEach(n => n.classList.remove('active')); }

        document.getElementById('nav-fav').onclick = () => {
            resetNav(); viewMode = 'favs';
            document.getElementById('nav-fav').classList.add('active');
            document.getElementById('search-container').style.display = 'none';
            render(favs);
        };

        document.getElementById('nav-exp').onclick = () => {
            resetNav(); viewMode = 'explore';
            document.getElementById('nav-exp').classList.add('active');
            document.getElementById('search-container').style.display = 'block';
            listContainer.innerHTML = '';
        };

        document.getElementById('nav-last').onclick = () => {
            resetNav(); viewMode = 'last';
            document.getElementById('nav-last').classList.add('active');
            document.getElementById('search-container').style.display = 'none';
            render(history);
        };

        queryInput.onkeypress = (e) => { if(e.key === 'Enter') { fetchStations(queryInput.value); queryInput.blur(); }};
    </script>
</body>
</html>
